name: Release

# A vX.Y.Z tag releases X.Y.Z, under npm's beta for a prerelease and latest
# otherwise; while LATEST_FOLLOWS_BETA is true, a prerelease moves latest too.
# Run by hand from main with a version, it rehearses that release:
# everything but the GitHub release and the npm publish. CONTRIBUTING.md
# "Releasing" has the steps.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The tag to rehearse, vX.Y.Z
        required: true

permissions: {}

env:
  # beam is beta-only: a prerelease also becomes npm's latest, so that
  # npm install gets it. false from 1.0, when latest is the last release.
  LATEST_FOLLOWS_BETA: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: tag
        run: node npm/version.mjs "$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.version || github.ref_name }}
      - run: make dist VERSION="$VERSION"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - run: node npm/pack.mjs "$VERSION"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - name: npm would publish every package at the binary's version
        run: |
          built=$(dist/beam-linux-amd64 version)
          for p in ./dist/npm/*/; do
            name=$(jq -r .name "$p/package.json")
            got=$(npm publish --dry-run --offline --json --tag "$DIST_TAG" "$p" | jq -r --arg n "$name" '(.[$n] // .).version')
            if [ "$got" != "$built" ]; then echo "$p: npm has $got, the binary $built"; exit 1; fi
          done
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/beam-*
      - name: the test kit's binaries join the release, with every binary's checksum
        run: |
          sleep 2 | dist/beamtest-linux-amd64 testkit --exit-with-parent | jq -e '.derpMap and .directory'
          cd dist && sha256sum beam-* beamtest-* > SHA256SUMS
      - if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" dist/beam-* dist/beamtest-* dist/SHA256SUMS --verify-tag --generate-notes --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}

  # Its own job, so that a publish that fails after the GitHub release exists
  # can be re-run alone. It packs the binaries the release job built. Each
  # package's trusted publisher names the npm environment, which only v* tags
  # and main deploy to.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    # One publish at a time, so that two betas cannot race for latest.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # npm 11.21.0 or later moves a dist-tag through trusted publishing, which
      # Node 24's own npm predates.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - run: node npm/pack.mjs "$VERSION"
      # npm publish exchanges the job's OIDC token even in a dry run, and logs
      # whether the package's trusted publisher took it. Every package must
      # before any is published: a publish that stops part-way spends the version.
      - name: npm takes this workflow as every package's trusted publisher
        run: |
          for p in ./dist/npm/beam-*/ ./dist/npm/beam/; do
            npm publish --dry-run --loglevel verbose --tag "$DIST_TAG" "$p" 2> npm.log || { cat npm.log; exit 1; }
            grep -q 'oidc Successfully retrieved and set token' npm.log || { grep oidc npm.log; echo "$p: no trusted publisher took this workflow"; exit 1; }
          done
      # Adding and removing a throwaway tag fails unless the trusted publisher
      # allows npm dist-tag. (npm sends nothing for a tag already on that
      # version, so re-pointing latest at itself would check nothing.)
      - if: env.LATEST_FOLLOWS_BETA == 'true' && env.DIST_TAG == 'beta'
        name: npm lets this workflow move every package's latest
        run: |
          for p in ./dist/npm/beam-*/ ./dist/npm/beam/; do
            name=$(jq -r .name "$p/package.json")
            latest=$(npm view "$name" dist-tags.latest)
            [ -n "$latest" ] || { echo "$name: npm has no latest"; exit 1; }
            npm dist-tag add "$name@$latest" release-check
            npm dist-tag rm "$name" release-check
          done
      - if: github.event_name == 'push'
        name: publish the platform packages, then the shim
        run: |
          for p in ./dist/npm/beam-*/ ./dist/npm/beam/; do
            npm publish --provenance --access public --tag "$DIST_TAG" "$p"
          done
      - if: github.event_name == 'push' && env.LATEST_FOLLOWS_BETA == 'true' && env.DIST_TAG == 'beta'
        name: latest follows beta, the platform packages', then the shim's
        run: |
          for p in ./dist/npm/beam-*/ ./dist/npm/beam/; do
            npm dist-tag add "$(jq -r .name "$p/package.json")@$VERSION" latest
          done
