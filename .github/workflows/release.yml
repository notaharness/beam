name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: tag
        run: node npm/version.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION="$VERSION"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - run: node npm/pack.mjs "$VERSION"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - name: npm would publish every package at the binary's version
        run: |
          built=$(dist/beam-linux-amd64 version)
          for p in dist/npm/*/; do
            name=$(jq -r .name "$p/package.json")
            got=$(npm publish --dry-run --offline --json --tag "$DIST_TAG" "$p" | jq -r --arg n "$name" '(.[$n] // .).version')
            if [ "$got" != "$built" ]; then echo "$p: npm has $got, the binary $built"; exit 1; fi
          done
        env:
          DIST_TAG: ${{ steps.tag.outputs.prerelease == 'true' && 'next' || 'latest' }}
      - run: gh release create "$GITHUB_REF_NAME" dist/beam-* --verify-tag --generate-notes --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
      - name: publish the platform packages, then the shim
        run: |
          for p in dist/npm/beam-*/ dist/npm/beam/; do
            npm publish --access public --provenance --tag "$DIST_TAG" "$p"
          done
        env:
          DIST_TAG: ${{ steps.tag.outputs.prerelease == 'true' && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
