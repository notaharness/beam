name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/beam-* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node npm/pack.mjs "${GITHUB_REF_NAME#v}"
      - name: publish the platform packages, then the shim
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          for p in dist/npm/beam-*/ dist/npm/beam/; do
            npm publish --access public --provenance --tag "$tag" "$p"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
