name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # A maintainer mentions @claude in an issue or PR comment, a review comment or a
  # review. `@claude review` belongs to claude-code-review.yml.
  claude:
    if: |
      contains(github.event.comment.body || github.event.review.body, '@claude') &&
      !startsWith(github.event.comment.body || github.event.review.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Claude reads CI results on PRs
    steps:
      # The action checks out a PR's head branch and gets a token that can push, so it
      # never runs on a fork PR. Fork PRs get `@claude review` instead.
      - name: Skip fork PRs
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          if [ -n "$PR" ]; then
            fork=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
            echo "fork PR: $fork"
            echo "skip=$fork" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fork.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.fork.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: steps.fork.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(go *),Bash(make *)"
