name = "beam"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = false
routes = [{ pattern = "beam.n10.is", custom_domain = true }]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "beam"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by `wrangler d1 create beam`'s id

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
