<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beam</title>
<style>
:root { --fg: #1b1b1b; --bg: #fff; --muted: #6b6b6b; --rule: #e2e2e2; --btn-bg: #1b1b1b; --btn-fg: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e8e8e8; --bg: #141414; --muted: #9a9a9a; --rule: #2c2c2c; --btn-bg: #e8e8e8; --btn-fg: #141414; }
}
body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; min-height: 100vh; margin: 0 auto; padding: 0 1rem; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; box-sizing: border-box; }
header { display: flex; align-items: center; gap: 0.75rem; padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--rule); }
header svg { width: 3rem; height: 3rem; flex: none; margin: -0.25rem; }
header span { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
main { flex: 1; padding: 1.5rem 0; }
h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0 0 1.5rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
code { font-size: 0.95rem; }
button { font: inherit; padding: 0.5rem 1.25rem; border-radius: 6px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; }
button:disabled { opacity: 0.5; cursor: default; }
#status { color: var(--muted); min-height: 1.5rem; }
footer { padding: 1.5rem 0 2rem; border-top: 1px solid var(--rule); font-size: 0.875rem; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<header>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" aria-hidden="true">
  <clipPath id="n">
    <path transform="translate(37.5 75.0)" d="M0,100 V25 H22.5 L23.5,37 C27,30 36,25 50,25 C64,25 75,36 75,53 V100 H50 V60 C50,50 46,45 38,45 C29,45 25,51 25,60 V100 Z" />
  </clipPath>
  <path transform="translate(37.5 75.0)" d="M0,100 V25 H22.5 L23.5,37 C27,30 36,25 50,25 C64,25 75,36 75,53 V100 H50 V60 C50,50 46,45 38,45 C29,45 25,51 25,60 V100 Z" fill="#9caf88" />
  <g transform="translate(100.0 75.0)" fill="#e3c16f">
    <rect x="0" y="0" width="25" height="100" />
    <rect x="50" y="12.5" width="50" height="75" rx="25" fill="none" stroke="#e3c16f" stroke-width="25" />
  </g>
  <g clip-path="url(#n)">
    <rect x="100.0" y="75.0" width="25" height="100" fill="#8b843b" />
  </g>
</svg>
<span>beam</span>
</header>
<main>
<h1 id="action">beam</h1>
<dl>
  <dt>Machine</dt><dd><strong id="label"></strong></dd>
  <dt>Fingerprint</dt><dd><code id="fingerprint"></code></dd>
</dl>
<p><button id="go" type="button" disabled>Continue with your passkey</button></p>
<p id="status"></p>
</main>
<footer>
<span>beam, a notaharness project</span>
<a href="https://github.com/notaharness/beam" rel="noopener">github.com/notaharness/beam</a>
</footer>
<script>
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  const op = p.get("o"), slot = p.get("s") || "", label = p.get("l") || "";
  const $ = (id) => document.getElementById(id);
  const say = (text) => { $("status").textContent = text; };
  const heading = { c: "Create your beam fleet", a: `Add ${label} to your fleet`, r: `Remove ${label} from your fleet` }[op];
  $("action").textContent = heading || "beam";
  $("label").textContent = label;
  $("fingerprint").textContent = (p.get("f") || "").replace(/(.{4})(?=.)/g, "$1 ");
  const decode = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const encode = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const bytes = (...parts) => {
    const all = parts.map((x) => (typeof x === "string" ? new TextEncoder().encode(x) : new Uint8Array(x)));
    const out = new Uint8Array(all.reduce((n, x) => n + x.length, 0));
    all.reduce((at, x) => (out.set(x, at), at + x.length), 0);
    return out;
  };
  // HPKE base mode, single shot (RFC 9180): DHKEM(X25519, HKDF-SHA256),
  // HKDF-SHA256, AES-128-GCM, sealed to the daemon's key for this slot.
  const u16 = (n) => [n >> 8, n & 255];
  const kemId = bytes("KEM", u16(0x20)), suiteId = bytes("HPKE", u16(0x20), u16(1), u16(1));
  const hmac = async (key, data) => new Uint8Array(await crypto.subtle.sign("HMAC",
    await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]), data));
  const extract = (suite, salt, label, ikm) => hmac(salt.length ? salt : new Uint8Array(32), bytes("HPKE-v1", suite, label, ikm));
  const expand = async (suite, prk, label, info, n) => (await hmac(prk, bytes(u16(n), "HPKE-v1", suite, label, info, [1]))).slice(0, n);
  async function seal(pkR, info, plaintext) {
    const e = await crypto.subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]);
    const enc = new Uint8Array(await crypto.subtle.exportKey("raw", e.publicKey));
    const dh = new Uint8Array(await crypto.subtle.deriveBits({ name: "X25519", public: pkR }, e.privateKey, 256));
    const shared = await expand(kemId, await extract(kemId, [], "eae_prk", dh), "shared_secret",
      bytes(enc, await crypto.subtle.exportKey("raw", pkR)), 32);
    const context = bytes([0], await extract(suiteId, [], "psk_id_hash", []), await extract(suiteId, [], "info_hash", info));
    const secret = await extract(suiteId, shared, "secret", []);
    const key = await crypto.subtle.importKey("raw", await expand(suiteId, secret, "key", context, 16), "AES-GCM", false, ["encrypt"]);
    const iv = await expand(suiteId, secret, "base_nonce", context, 12);
    return bytes(enc, await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext));
  }
  let pkR;
  async function send(result, out) {
    const sealed = await seal(pkR, bytes("beam-ceremony:v1", slot), bytes(new URLSearchParams({ result, ...out }).toString()));
    const res = await fetch("/v1/slots/" + slot, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sealed: encode(sealed) }) });
    if (res.status === 201) return say("Done. The machine finishes on its own; you can close this page.");
    if (res.status === 409) {
      return say(`This request was already answered from another device. If that was not you, someone who saw the code answered it: check ${label || "the machine"}, and if it enrolled, run beam fleet reset there.`);
    }
    say("beam.n10.is did not take the answer (" + res.status + "). Run the beam command again.");
  }
  async function create() {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { id: "beam.n10.is", name: "beam" },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: p.get("n") || "beam", displayName: p.get("n") || "beam" },
      challenge: decode(p.get("c")),
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -8 }],
      authenticatorSelection: { residentKey: "required", userVerification: "required" },
      extensions: { prf: {} },
    } });
    if (cred.getClientExtensionResults().prf?.enabled !== true) return ["prf-unsupported", {}];
    return ["ok", { credentialId: encode(cred.rawId), clientDataJSON: encode(cred.response.clientDataJSON), attestationObject: encode(cred.response.attestationObject) }];
  }
  async function get() {
    const cred = await navigator.credentials.get({ publicKey: {
      rpId: "beam.n10.is",
      challenge: decode(p.get("c")),
      userVerification: "required",
      extensions: { prf: { eval: { first: new TextEncoder().encode("beam:v1:directory") } } },
    } });
    const first = cred.getClientExtensionResults().prf?.results?.first;
    if (!first) return ["prf-unsupported", {}];
    return ["ok", {
      credentialId: encode(cred.rawId), clientDataJSON: encode(cred.response.clientDataJSON),
      authenticatorData: encode(cred.response.authenticatorData), signature: encode(cred.response.signature), prf: encode(first),
    }];
  }
  (async () => {
    if (!heading || !/^[A-Za-z0-9_-]{22}$/.test(slot) || !p.get("k") || !p.get("c")) {
      return say("This link is incomplete. Run the beam command again.");
    }
    try {
      pkR = await crypto.subtle.importKey("raw", decode(p.get("k")), { name: "X25519" }, true, []);
    } catch {
      return say("This browser cannot seal beam's answer: it needs X25519 in Web Crypto (Safari 17, Chrome 133, Firefox 130 or later).");
    }
    say("Continue only if you started this just now.");
    $("go").disabled = false;
  })();
  $("go").addEventListener("click", async () => {
    $("go").disabled = true;
    say("Waiting for your passkey…");
    let answer;
    try {
      answer = await (op === "c" ? create() : get());
    } catch (e) {
      answer = [e && e.name === "NotAllowedError" ? "cancelled" : "failed", {}];
    }
    await send(...answer).catch(() => say("beam.n10.is could not be reached. Run the beam command again."));
  });
})();
</script>
</body>
</html>
