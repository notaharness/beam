<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beam</title>
<style>
:root { --fg: #1b1b1b; --bg: #fff; --muted: #6b6b6b; --rule: #e2e2e2; --btn-bg: #1b1b1b; --btn-fg: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e8e8e8; --bg: #141414; --muted: #9a9a9a; --rule: #2c2c2c; --btn-bg: #e8e8e8; --btn-fg: #141414; }
}
body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; min-height: 100vh; margin: 0 auto; padding: 0 1rem; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; box-sizing: border-box; }
header { display: flex; align-items: center; gap: 0.75rem; padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--rule); }
header svg { width: 3rem; height: 3rem; flex: none; margin: -0.25rem; }
header span { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
main { flex: 1; padding: 1.5rem 0; }
h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0 0 1.5rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
code { font-size: 0.95rem; }
button { font: inherit; padding: 0.5rem 1.25rem; border-radius: 6px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; }
button:disabled { opacity: 0.5; cursor: default; }
#status { color: var(--muted); min-height: 1.5rem; }
footer { padding: 1.5rem 0 2rem; border-top: 1px solid var(--rule); font-size: 0.875rem; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<header>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" aria-hidden="true">
  <clipPath id="n">
    <path transform="translate(37.5 75.0)" d="M0,100 V25 H22.5 L23.5,37 C27,30 36,25 50,25 C64,25 75,36 75,53 V100 H50 V60 C50,50 46,45 38,45 C29,45 25,51 25,60 V100 Z" />
  </clipPath>
  <path transform="translate(37.5 75.0)" d="M0,100 V25 H22.5 L23.5,37 C27,30 36,25 50,25 C64,25 75,36 75,53 V100 H50 V60 C50,50 46,45 38,45 C29,45 25,51 25,60 V100 Z" fill="#9caf88" />
  <g transform="translate(100.0 75.0)" fill="#e3c16f">
    <rect x="0" y="0" width="25" height="100" />
    <rect x="50" y="12.5" width="50" height="75" rx="25" fill="none" stroke="#e3c16f" stroke-width="25" />
  </g>
  <g clip-path="url(#n)">
    <rect x="100.0" y="75.0" width="25" height="100" fill="#8b843b" />
  </g>
</svg>
<span>beam</span>
</header>
<main>
<h1 id="action">beam</h1>
<dl>
  <dt>Machine</dt><dd><strong id="label"></strong></dd>
  <dt>Fingerprint</dt><dd><code id="fingerprint"></code></dd>
</dl>
<p><button id="go" type="button" disabled>Continue with your passkey</button></p>
<p id="status"></p>
</main>
<footer>
<span>beam, a notaharness project</span>
<a href="https://github.com/notaharness/beam" rel="noopener">github.com/notaharness/beam</a>
</footer>
<script>
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  const op = p.get("op"), state = p.get("state") || "", port = Number(p.get("port"));
  const $ = (id) => document.getElementById(id);
  $("action").textContent = p.get("action") || "beam";
  $("label").textContent = p.get("label") || "";
  $("fingerprint").textContent = p.get("fingerprint") || "";
  const valid = (op === "create" || op === "get") && Number.isInteger(port) && port > 0 && port < 65536 && state;
  if (!valid) {
    $("status").textContent = "This link is incomplete. Run the beam command again.";
    return;
  }
  const decode = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const encode = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const back = (result, out) => {
    location.href = "http://127.0.0.1:" + port + "/cb#" + new URLSearchParams({ state, result, ...out });
  };
  async function create() {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { id: "beam.n10.is", name: "beam" },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: p.get("fleetName") || "beam", displayName: p.get("fleetName") || "beam" },
      challenge: decode(p.get("challenge") || ""),
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -8 }],
      authenticatorSelection: { residentKey: "required", userVerification: "required" },
      extensions: { prf: {} },
    } });
    if (cred.getClientExtensionResults().prf?.enabled !== true) return back("prf-unsupported", {});
    back("ok", { credentialId: encode(cred.rawId), clientDataJSON: encode(cred.response.clientDataJSON), attestationObject: encode(cred.response.attestationObject) });
  }
  async function get() {
    const cred = await navigator.credentials.get({ publicKey: {
      rpId: "beam.n10.is",
      challenge: decode(p.get("challenge") || ""),
      userVerification: "required",
      extensions: { prf: { eval: { first: new TextEncoder().encode("beam:v1:directory") } } },
    } });
    const first = cred.getClientExtensionResults().prf?.results?.first;
    if (!first) return back("prf-unsupported", {});
    back("ok", {
      credentialId: encode(cred.rawId), clientDataJSON: encode(cred.response.clientDataJSON),
      authenticatorData: encode(cred.response.authenticatorData), signature: encode(cred.response.signature), prf: encode(first),
    });
  }
  $("go").disabled = false;
  $("go").addEventListener("click", async () => {
    $("go").disabled = true;
    $("status").textContent = "Waiting for your passkey…";
    try {
      await (op === "create" ? create() : get());
    } catch (e) {
      back(e && e.name === "NotAllowedError" ? "cancelled" : "failed", {});
    }
  });
})();
</script>
</body>
</html>
