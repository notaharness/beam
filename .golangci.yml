version: "2"

linters:
  enable:
    - gocyclo
    - revive
  settings:
    gocyclo:
      min-complexity: 12
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 300
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gocyclo, revive]

formatters:
  enable:
    - gofmt
